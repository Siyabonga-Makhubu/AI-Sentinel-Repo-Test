[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-sentinel-vulnerable-lab"
version = "0.1.0"
description = "Isolated intentionally vulnerable repository for authorized scanner evaluation"
requires-python = ">=3.10"
dependencies = ["fastapi==0.115.12", "uvicorn==0.34.2", "requests==2.19.1", "PyYAML==5.1.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
